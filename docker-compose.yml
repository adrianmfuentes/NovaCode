version: "3.8"

services:
  backend:
    build: ./backend
    container_name: novacode-backend
    restart: always
    environment:
      - SERVER_PORT=8080
    ports:
      - "8247:8080"
    networks:
      - novacode-net

  frontend:
    build: ./frontend
    container_name: novacode-frontend
    restart: always
    ports:
      - "3247:80" # Exposed on host port 3001
    depends_on:
      - backend
    networks:
      - novacode-net

networks:
  novacode-net:
    driver: bridge

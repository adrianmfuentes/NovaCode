<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaCode | Compiler IDE</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#0d1117] text-gray-300 h-screen overflow-hidden flex flex-col">

<header class="h-14 border-b border-gray-800 flex items-center justify-between px-6 bg-[#161b22]">
    <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-white">NC</div>
        <h1 class="text-lg font-semibold tracking-tight text-white">Nova<span class="text-blue-500">Code</span></h1>
    </div>
    <div class="flex items-center gap-4">
        <button onclick="compileCode()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-md text-sm font-medium transition-all flex items-center gap-2">
            <span>▶</span> Ejecutar
        </button>
        <button id="downloadBtn" onclick="downloadCode()" class="hidden border border-gray-700 hover:bg-gray-800 text-gray-300 px-4 py-1.5 rounded-md text-sm font-medium transition-all">
            📥 Descargar .mapl
        </button>
    </div>
</header>

<main class="flex-1 flex overflow-hidden">

    <section class="flex-1 flex flex-col border-r border-gray-800">
        <div class="bg-[#0d1117] px-4 py-2 text-xs font-semibold uppercase tracking-wider text-gray-500 border-b border-gray-800">
            Editor de Código
        </div>
        <div id="monaco-editor" class="flex-1"></div>
    </section>

    <section class="w-1/3 flex flex-col bg-[#0d1117]">
        <div class="flex border-b border-gray-800 bg-[#161b22]">
            <button class="px-4 py-2 text-xs font-semibold border-b-2 border-blue-500 text-white">SALIDA MAPL</button>
        </div>

        <div class="flex-1 p-4 overflow-auto font-mono text-sm" id="console-output">
            <div class="text-gray-600 italic">// Esperando instrucciones...</div>
        </div>

        <div id="status-bar" class="h-8 border-t border-gray-800 flex items-center px-4 text-[10px] font-bold uppercase tracking-widest text-gray-500">
            Listo
        </div>
    </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
<script src="script.js"></script>
</body>
</html>
